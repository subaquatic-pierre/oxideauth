[package]
name = "oxideauth"
version = "0.1.0"
edition = "2024"

[dependencies]

# ──────────────────────────────────────────────────────────────────────────────
# Runtime, Async, Utilities
# ──────────────────────────────────────────────────────────────────────────────
anyhow = "1"
ctrlc = "3.2"
dotenv = "0.15.0"
rand = "0.7"
uuid = { version = "1.3.3", features = ["v4", "fast-rng", "macro-diagnostics", "serde"] }
tokio = { version = "1.36", features = ["full"] }

# ──────────────────────────────────────────────────────────────────────────────
# Logging
# ──────────────────────────────────────────────────────────────────────────────
env_logger = "0.10.0"
log = "0.4.18"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# ──────────────────────────────────────────────────────────────────────────────
# CLI / HTTP Client
# ──────────────────────────────────────────────────────────────────────────────
clap = { version = "4.0", features = ["derive"] }
reqwest = { version = "0.12.5", features = ["json"] }

# ──────────────────────────────────────────────────────────────────────────────
# Web Axum
# ──────────────────────────────────────────────────────────────────────────────
axum = {version = "0.7.7", features= ['macros'] }
# For CORS
tower-http = { version = "0.5", features = ["cors","trace"] }
tower = "0.5.2"

# For parsing headers in your auth middleware
# headers = "0.4"
axum-extra = { version = "0.9", features = ["typed-header"] } 

# ──────────────────────────────────────────────────────────────────────────────
# Serialization
# ──────────────────────────────────────────────────────────────────────────────
serde = "1.0.203"
serde_json = "1.0.119"
serde_with = "3.14.0"
time = {version = "0.3", features = ["formatting", "parsing", "serde"]}
strum = "0.24"
strum_macros = "0.24"
hex = "0.4.3"
sha2 = "0.10.6"
bincode = "1.3.3"
url = "2.5"

# ──────────────────────────────────────────────────────────────────────────────
# Auth / Security
# ──────────────────────────────────────────────────────────────────────────────
jsonwebtoken = "9.3.0"
rust-argon2 = "0.5"

# ──────────────────────────────────────────────────────────────────────────────
# AWS SDKs
# ──────────────────────────────────────────────────────────────────────────────
aws-sdk-s3  = { version = "1.42.0", features = ["behavior-version-latest"] }
aws-sdk-ses = { version = "1.36.0", features = ["behavior-version-latest"] }

# ──────────────────────────────────────────────────────────────────────────────
# Email / Templates
# ──────────────────────────────────────────────────────────────────────────────
lettre = "0.11.7"
lettre_email = "0.9.4"
tera = "1.20.0"

# ──────────────────────────────────────────────────────────────────────────────
# Database (SQLx)
# ──────────────────────────────────────────────────────────────────────────────
sqlx = { version = "0.8.6", features = [
    "runtime-tokio-rustls", # Tokio + rustls TLS
    "postgres",             # Postgres driver
    "uuid",                 # UUID (for id columns)
    # "chrono",               # Date/Time support
    "migrate",               # Enable sqlx::migrate!(),
    "macros", 
    "json",
    "rust_decimal"
] }
sea-query = { version= "0.32.7", features = ["backend-postgres", "with-uuid", "with-json","postgres-array"] }
sea-query-binder = { version = "0.7", features = ["sqlx-postgres", "with-uuid", "with-time", "with-json", "postgres-array" ] }
modql = { version = "0.4.1", features = ["with-sea-query"]}

# ──────────────────────────────────────────────────────────────────────────────
# Vendored OpenSSL (compile from source when system openssl is not available)
# ──────────────────────────────────────────────────────────────────────────────
openssl = { version = "0.10", features = ["vendored"] }

# ──────────────────────────────────────────────────────────────────────────────
# Database / Cache (Redis)
# ──────────────────────────────────────────────────────────────────────────────
redis = { version = "0.32.7", features = ["tokio-comp", "tokio-native-tls-comp", "connection-manager", "uuid", "json"] }

# ──────────────────────────────────────────────────────────────────────────────
# Test / Mock
# ──────────────────────────────────────────────────────────────────────────────
mockito = "1.5.0"
derive_more = { version = "2.0.1", features = ["from", "display"] }

# ──────────────────────────────────────────────────────────────────────────────
# Macros
# ──────────────────────────────────────────────────────────────────────────────
oxideauth-macros = { path = "./macros" }

[dev-dependencies]
serial_test = "0.6"
mockall = "0.13.0"


[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ["cfg(feature, values(\"db-self-test\"))"]

[lints.rust.unused]
level = "allow"

# [lints.rust.unused_imports]
# level = "warn"

# [lints.rust.unused_variables]
# level = "warn"

[features]
default = []

